[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lookahead-guard"
version = "0.1.0"
description = "前视偏差体检：只做可机械验证的检查（原语尾随性 / 未来盲 / 静态写法 / 置换显著性），不预测收益。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lookahead-guard contributors" }]
keywords = ["lookahead-bias", "backtest", "quant", "data-leakage", "verification"]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
full = ["pandas>=1.5", "scipy>=1.9"]
dev = ["pytest>=7"]

[project.scripts]
lookahead-guard = "lookahead_guard.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
